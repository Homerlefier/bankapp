<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>BankApp</title><link rel="stylesheet" href="styles.css"><style>body{padding-bottom:80px;}</style></head><body><div class="app-header"><div class="header-left"><div class="user-avatar" onclick="window.location.href='profil.html'" id="userAvatar">NV</div><input type="text" class="search-input" placeholder="Search"/></div><div class="header-icons"><div class="header-icon" onclick="window.location.href='notifications.html'" id="hIcon1"></div><div class="header-icon" onclick="window.location.href='menu.html'" id="hIcon2"></div></div></div><div class="balance-section"><div class="account-type">Personnel · EUR</div><div class="main-balance" id="mainBalance">0,00 €</div><button class="accounts-button" onclick="window.location.href='compte.html'">Comptes</button><div class="card-indicators"><div class="card-dot active"></div><div class="card-dot"></div><div class="card-dot"></div><div class="card-dot"></div></div></div><div class="action-buttons"><div class="action-button" onclick="openAddMoneyModal()"><div class="action-circle" id="addIcon"></div><div class="action-label">Ajouter</div></div><div class="action-button" onclick="window.location.href='exchange.html'"><div class="action-circle" id="exchangeIcon"></div><div class="action-label">Échanger</div></div><div class="action-button" onclick="window.location.href='compte.html'"><div class="action-circle" id="detailsIcon"></div><div class="action-label">Détails</div></div><div class="action-button" onclick="window.location.href='menu.html'"><div class="action-circle" id="moreIcon"></div><div class="action-label">Plus</div></div></div><div class="transactions-container"><div class="section-header"><div class="section-title">Transactions</div><a href="transactions.html" class="see-all-link">Tout voir</a></div><div id="transactionsList"></div></div><div id="addMoneyModal" class="modal-overlay hidden"><div class="modal-content"><div class="modal-header"><div class="modal-title">Ajouter de l'argent</div><button class="modal-close" onclick="closeAddMoneyModal()">×</button></div><div style="margin-bottom:20px;"><label style="display:block;font-size:13px;font-weight:600;color:var(--revolut-text-secondary);margin-bottom:8px;">Montant</label><input type="number" id="amountInput" placeholder="0,00" step="0.01" style="font-size:24px;text-align:center;font-weight:700;"/></div><div style="margin-bottom:20px;"><label style="display:block;font-size:13px;font-weight:600;color:var(--revolut-text-secondary);margin-bottom:8px;">Description</label><input type="text" id="descriptionInput" placeholder="Ex: Salaire..."/></div><div style="margin-bottom:20px;"><label style="display:block;font-size:13px;font-weight:600;color:var(--revolut-text-secondary);margin-bottom:8px;">Catégorie</label><select id="categoryInput"><option value="income">Revenu</option><option value="transfer">Virement</option><option value="other">Autre</option></select></div><button class="btn btn-primary" onclick="addMoney()">Confirmer</button></div></div><div class="bottom-nav"><div class="nav-item active" onclick="window.location.href='index.html'"><div id="n1"></div><div class="nav-label">Accueil</div></div><div class="nav-item" onclick="window.location.href='analytics.html'"><div id="n2"></div><div class="nav-label">Analytique</div></div><div class="nav-item" onclick="window.location.href='virement.html'"><div id="n3"></div><div class="nav-label">Virements</div></div><div class="nav-item" onclick="window.location.href='cards.html'"><div id="n4"></div><div class="nav-label">Cartes</div></div><div class="nav-item" onclick="window.location.href='menu.html'"><div id="n5"></div><div class="nav-label">Plus</div></div></div><script src="icons.js"></script><script src="database.js"></script><script>document.getElementById('addIcon').innerHTML=Icons.add;document.getElementById('exchangeIcon').innerHTML=Icons.exchange;document.getElementById('detailsIcon').innerHTML=Icons.details;document.getElementById('moreIcon').innerHTML=Icons.more;document.getElementById('n1').innerHTML=Icons.home;document.getElementById('n2').innerHTML=Icons.stats;document.getElementById('n3').innerHTML=Icons.transfer;document.getElementById('n4').innerHTML=Icons.card;document.getElementById('n5').innerHTML=Icons.menu;document.getElementById('hIcon1').innerHTML=Icons.notifications;document.getElementById('hIcon2').innerHTML=Icons.settings;function loadData(){const user=DB.getUser();document.getElementById('userAvatar').textContent=user.avatar;const totalBalance=DB.getTotalBalance();document.getElementById('mainBalance').textContent=formatCurrency(totalBalance);loadRecentTransactions()}function loadRecentTransactions(){const transactions=DB.getTransactions().slice(0,10);const container=document.getElementById('transactionsList');let currentDate=null;let html='';transactions.forEach(transaction=>{const transactionDate=formatDate(transaction.date);if(transactionDate!==currentDate){html+=`<div class="date-divider">${transactionDate}</div>`;currentDate=transactionDate}const iconName=transaction.category||'shopping';const icon=Icons[iconName]||Icons.shopping;html+=`<div class="transaction-item"><div class="transaction-icon">${icon}</div><div class="transaction-details"><div class="transaction-name">${transaction.description}</div><div class="transaction-time">${formatTime(transaction.date)}</div></div><div class="transaction-amount ${transaction.amount>=0?'positive':'negative'}">${transaction.amount>=0?'+':''}${formatCurrency(transaction.amount)}</div></div>`});container.innerHTML=html}function openAddMoneyModal(){document.getElementById('addMoneyModal').classList.remove('hidden')}function closeAddMoneyModal(){document.getElementById('addMoneyModal').classList.add('hidden');document.getElementById('amountInput').value='';document.getElementById('descriptionInput').value=''}function addMoney(){const amount=parseFloat(document.getElementById('amountInput').value);const description=document.getElementById('descriptionInput').value;const category=document.getElementById('categoryInput').value;if(!amount||!description){showToast('Veuillez remplir tous les champs','error');return}DB.addTransaction({accountId:1,description:description,amount:amount,category:category});showToast('Transaction ajoutée avec succès','success');closeAddMoneyModal();loadData()}window.addEventListener('DOMContentLoaded',loadData);</script></body></html>
